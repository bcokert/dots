<style>
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { position: relative; padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); }
  .card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 4px; background: var(--m); }
  .card[data-effort="low"] { border-style: dashed; }
  .card[data-effort="high"] { border-width: 2.5px; border-color: var(--m); }
  .card[data-effort="max"] { border-width: 2.5px; border-color: var(--m); box-shadow: 0 0 14px -2px var(--m); }
  .m-fable { --m: #d4a72c; } .m-opus { --m: #8b5cf6; } .m-sonnet { --m: #3b82f6; } .m-haiku { --m: #22a06b; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .title { font-weight: 600; flex: 1; }
  .who { font-size: 12px; color: var(--m); font-weight: 600; }
  .what { margin: 4px 0 8px; font-size: 13px; color: var(--muted-foreground); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .chip { padding: 1px 8px; border-radius: 999px; background: var(--muted); }
  .par { display: flex; gap: 6px; align-items: center; margin-left: auto; color: var(--muted-foreground); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; font-size: 13px; }
  .legend { color: var(--muted-foreground); font-size: 12px; margin-left: auto; }
</style>
<div class="cards" id="cards"></div>
<div class="bar">
  <button type="button" id="go">Put my choice in my message</button>
  <span id="status" role="status"></span>
  <span class="legend">colour = model · border = effort (dashed low, thin medium, thick high, glow max) · chip = budget</span>
</div>
<script>
(function () {
  // The lead edits only this list. who: "me" (the lead) or "subagent"; model: fable | opus | sonnet | haiku;
  // effort: low | medium | high | max; budget: rough tokens as the usage panel counts them; parallel: can run
  // alongside the others (Bdon opts in per slice); after: the slice it waits for, if any.
  const SLICES = [
    { title: "Example slice", what: "One line on what it delivers", who: "subagent", model: "sonnet", effort: "medium", budget: "~100k", parallel: true },
  ];
  const cards = document.getElementById("cards");
  SLICES.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "card m-" + s.model;
    card.dataset.effort = s.effort;
    const top = document.createElement("div"); top.className = "top";
    const title = document.createElement("span"); title.className = "title"; title.textContent = (i + 1) + ". " + s.title;
    const who = document.createElement("span"); who.className = "who"; who.textContent = (s.who === "me" ? "lead" : "subagent") + " · " + s.model;
    top.append(title, who);
    const what = document.createElement("div"); what.className = "what"; what.textContent = s.what + (s.after ? " (after " + s.after + ")" : "");
    const chips = document.createElement("div"); chips.className = "chips";
    const budget = document.createElement("span"); budget.className = "chip"; budget.textContent = s.budget + " tokens";
    const effort = document.createElement("span"); effort.className = "chip"; effort.textContent = s.effort + " effort";
    chips.append(budget, effort);
    if (s.parallel) {
      const label = document.createElement("label"); label.className = "par";
      const box = document.createElement("input"); box.type = "checkbox"; box.id = "p" + i; box.dataset.i = String(i);
      label.htmlFor = box.id; label.append(box, document.createTextNode("parallel"));
      chips.append(label);
    }
    card.append(top, what, chips);
    cards.append(card);
  });
  document.getElementById("go").addEventListener("click", () => {
    const picked = [...document.querySelectorAll("input[type=checkbox]:checked")].map((b) => SLICES[Number(b.dataset.i)].title);
    const text = picked.length ? "Go. Run in parallel: " + picked.join(", ") + ". The rest one after another." : "Go, one after another.";
    document.getElementById("status").textContent = genui.answer(text) ? "In your message; send when ready." : "Couldn't add it.";
  });
})();
</script>
