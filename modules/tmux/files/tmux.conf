# Managed by dots (modules/tmux/files/tmux.conf).
source-file -q ~/.config/tmux/host.conf   # sets @host_color for this machine type

set -g prefix C-a
setw -g mode-keys vi

set -sg escape-time 0
set -g history-limit 500000
set -g focus-events on
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -g mouse on

# Terminal + true colour (macOS lacks the tmux-256color terminfo, so fall back there)
set -g default-terminal "tmux-256color"
if-shell '! infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "screen-256color"'
set -as terminal-overrides ",xterm*:Tc:smcup@:rmcup@,*256col*:Tc,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:usstyle:overline"

# Mouse wheel scrolls back into copy mode (or passes through to apps that use the mouse)
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard: copies go out via OSC 52, so they land on the machine you're typing on (local or over SSH)
set -s set-clipboard on
set -g allow-passthrough on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Keys
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind H split-window -h -c "#{pane_current_path}"
bind V split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Numbering + names
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g pane-border-status top
set -g pane-border-format " [ #P ] "

# Look: dim inactive panes, Nord-ish status bar, hostname in the machine-type colour
set -g window-style 'bg=#14151e'
set -g window-active-style 'bg=#1a1b26'
set -g pane-border-style 'fg=#3b4252'
set -g pane-active-border-style 'fg=#4a6fa5'
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#2e3440,bg=#{@host_color},bold] #h #[fg=#2e3440,bg=#5e81ac,bold] #S "
setw -g window-status-format "#[fg=#d8dee9,bg=#3b4252] #I #W "
setw -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,bold] #I #W "
set -g status-right "#[fg=#2e3440,bg=#5e81ac,bold] %b %d #[fg=#2e3440,bg=#88c0d0,bold] %H:%M "
